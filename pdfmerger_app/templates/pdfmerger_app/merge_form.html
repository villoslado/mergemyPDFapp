{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PDF Merger</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <script crossorigin
                src="https://unpkg.com/react@18/umd/react.production.min.js"
                defer></script>
        <script crossorigin
                src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
                defer></script>
        <script src="{% static 'pdfmerger_app/js/merge_form.js' %}" defer></script>
    </head>
    <body>
        <div class="container mt-5">
            <h1 class="text-left">Merge PDFs</h1>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div id="merge-form-root">
                    <div class="mb-3">
                        <label for="file1" class="form-label">Upload PDF 1</label>
                        <input type="file"
                               id="file1"
                               class="form-control"
                               name="files"
                               accept="application/pdf"
                               required>
                    </div>
                    <button type="button" class="btn btn-secondary me-2">Add Another File</button>
                </div>
                <div class="d-flex align-items-center">
                    <button type="submit" class="btn btn-primary">Merge</button>
                </div>
            </form>
        </div>
    </body>
</html>
